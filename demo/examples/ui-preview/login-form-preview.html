<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CSMA Auth Shell Preview</title>
    <link rel="stylesheet" href="../../generated/tokens.css" />
    <link rel="stylesheet" href="../../../library/style/base.css" />
    <link rel="stylesheet" href="../../../library/style/foundation/layout.css" />
    <link rel="stylesheet" href="../../../library/style/foundation/motion.css" />
    <link rel="stylesheet" href="../../../library/style/foundation/hardening/text-overflow.css" />
    <link rel="stylesheet" href="../../../library/style/foundation/hardening/states.css" />
    <link rel="stylesheet" href="../../../library/style/foundation/hardening/accessibility.css" />
    <link rel="stylesheet" href="../../../library/style/foundation/hardening/i18n.css" />
    <link rel="stylesheet" href="../../../library/style/foundation/hardening/loading.css" />
    <link rel="stylesheet" href="../../../library/style/foundation/hardening/error.css" />
    <link rel="stylesheet" href="../../../library/style/foundation/print.css" />
    <link rel="stylesheet" href="../../../library/style/touch.css" />
    <link rel="stylesheet" href="../../../library/ui/components/button/button.css" />
    <link rel="stylesheet" href="../../../library/ui/components/badge/badge.css" />
    <link rel="stylesheet" href="../../../library/ui/components/card/card.css" />
    <link rel="stylesheet" href="../../../library/ui/components/field/field.css" />
    <link rel="stylesheet" href="../../../library/ui/components/input/input.css" />
    <link rel="stylesheet" href="../../../library/ui/components/toast/toast.css" />
    <link rel="stylesheet" href="../../../library/ui/components/theme-toggle/theme-toggle.css" />
  </head>
  <body>
    <main class="stack" data-gap="xl" style="max-width: 72rem; margin: 0 auto; padding: 2rem 1rem 4rem;">
      <header class="stack" data-gap="md">
        <div class="cluster" data-align="space-between">
          <div class="stack" data-gap="sm">
            <h1>AI UI Auth Shell Preview</h1>
            <p class="text-muted">Runs `ai-ui.login-form` and `ai-ui.contact-form` through `INTENT_VIEW_RENDER` and renders them inside the same visible `auth-shell`.</p>
          </div>
          <button class="theme-toggle" type="button" data-theme-toggle data-theme-active="light">
            <span class="theme-toggle__icons" aria-hidden="true">
              <span class="theme-icon theme-icon--sun">☀</span>
              <span class="theme-icon theme-icon--moon">◐</span>
              <span class="theme-icon theme-icon--contrast">◫</span>
            </span>
            <span class="theme-toggle__label" data-theme-label>Theme: Light</span>
          </button>
        </div>
        <div class="cluster">
          <button class="button" type="button" data-open-summary>Open Component Summary</button>
          <button class="button" type="button" data-show-login>Show Login Form</button>
          <button class="button" type="button" data-show-login-custom data-variant="secondary">Show Custom Login</button>
          <button class="button" type="button" data-show-contact>Show Contact Form</button>
        </div>
      </header>

      <section class="grid" data-responsive-columns="2" style="align-items: start;">
        <div class="stack" data-gap="lg">
          <section id="auth-shell-preview" class="stack" data-gap="lg"></section>
        </div>

        <aside class="stack" data-gap="lg">
          <article class="card">
            <header class="card__header">
              <h2 class="card__title">Render Result</h2>
              <p class="card__description">Diagnostic view model returned by `INTENT_VIEW_RENDER` after shell + content compilation.</p>
            </header>
            <div class="card__body">
              <pre id="result-json" style="margin: 0; overflow: auto; font-family: var(--font-family-mono); font-size: var(--font-size-sm);"></pre>
            </div>
          </article>
        </aside>
      </section>
    </main>

    <script src="./generated/login-form-preview-data.js"></script>
    <script>
      const STORAGE_KEY = 'csma-theme';
      const THEMES = ['light', 'dark', 'contrast'];
      const labels = { light: 'Light', dark: 'Dark', contrast: 'Contrast' };

      function getCurrentTheme() {
        const stored = localStorage.getItem(STORAGE_KEY);
        return THEMES.includes(stored) ? stored : THEMES[0];
      }

      function applyTheme(theme) {
        document.documentElement.dataset.theme = theme;
        localStorage.setItem(STORAGE_KEY, theme);
      }

      function cycleTheme() {
        const current = getCurrentTheme();
        const index = THEMES.indexOf(current);
        const next = THEMES[(index + 1) % THEMES.length];
        applyTheme(next);
        return next;
      }

      function nextTheme(theme) {
        return THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
      }

      function syncThemeToggle(button, label) {
        const current = getCurrentTheme();
        const next = nextTheme(current);
        button.dataset.themeActive = current;
        button.setAttribute('aria-label', `Switch to ${next} theme`);
        label.textContent = `Theme: ${labels[current] || current}`;
      }

      class EventBus {
        constructor() {
          this.listeners = new Map();
        }

        subscribe(eventName, handler) {
          if (!this.listeners.has(eventName)) {
            this.listeners.set(eventName, []);
          }
          this.listeners.get(eventName).push(handler);
          return () => {
            const list = this.listeners.get(eventName) || [];
            const index = list.indexOf(handler);
            if (index >= 0) {
              list.splice(index, 1);
            }
          };
        }

        async publish(eventName, payload) {
          const handlers = this.listeners.get(eventName) || [];
          const results = [];
          for (const handler of handlers) {
            results.push(await handler(payload));
          }
          return results;
        }
      }

      class ViewRegistry {
        constructor(eventBus) {
          this.eventBus = eventBus;
          this.views = new Map();
          this.eventBus.subscribe('INTENT_VIEW_RENDER', (payload) => this.render(payload.viewId, payload));
        }

        register(view) {
          this.views.set(view.id, view);
        }

        async render(viewId, payload) {
          const view = this.views.get(viewId);
          if (!view) {
            throw new Error(`Unknown view "${viewId}"`);
          }
          return view.render(payload);
        }
      }

      const componentCatalog = {
        badge: { props: ['variant', 'size', 'text', 'label', 'tone', 'value'], slots: {}, requiredSlots: [] },
        button: { props: ['variant', 'size', 'shape', 'text', 'label'], slots: {}, requiredSlots: [] },
        card: { props: ['title', 'description', 'tone'], slots: { body: ['field', 'input', 'button', 'badge'], footer: ['button', 'badge'] }, requiredSlots: ['body'] },
        field: { props: ['label', 'helper', 'error', 'for', 'required'], slots: { control: ['input'] }, requiredSlots: ['control'] },
        input: { props: ['id', 'type', 'name', 'value', 'placeholder', 'autocomplete', 'state'], slots: {}, requiredSlots: [] }
      };
      const authShellLayout = window.CSMA_ARCHETYPE_PREVIEW.layout;
      const contentArchetypes = window.CSMA_ARCHETYPE_PREVIEW.contentArchetypes;
      const legacyViews = window.CSMA_ARCHETYPE_PREVIEW.legacyViews || {};

      function cloneResultModel(model) {
        return model ? JSON.parse(JSON.stringify(model)) : null;
      }

      function resolveValue(value, context) {
        if (typeof value !== 'string') {
          return value;
        }
        return value.replace(/\{\{\s*([a-zA-Z0-9_]+)\s*\}\}/g, (_, key) => key in context ? String(context[key]) : '');
      }

      function resolveNode(node, context) {
        const props = {};
        Object.entries(node.props || {}).forEach(([key, value]) => {
          props[key] = resolveValue(value, context);
        });

        const slots = {};
        Object.entries(node.slots || {}).forEach(([slotName, children]) => {
          slots[slotName] = children.map((child) => resolveNode(child, context));
        });

        return {
          component: node.component,
          props,
          ...(Object.keys(slots).length > 0 ? { slots } : {})
        };
      }

      function validateNode(node, path = 'root') {
        const definition = componentCatalog[node.component];
        if (!definition) {
          throw new Error(`Unknown component id "${node.component}" at ${path}`);
        }

        const allowedProps = new Set(definition.props);
        Object.keys(node.props || {}).forEach((propName) => {
          if (!allowedProps.has(propName)) {
            throw new Error(`Unsupported prop "${propName}" on component "${node.component}" at ${path}`);
          }
        });

        const slots = node.slots || {};
        (definition.requiredSlots || []).forEach((slotName) => {
          if (!Array.isArray(slots[slotName])) {
            throw new Error(`Missing required slot "${slotName}" on component "${node.component}" at ${path}`);
          }
        });

        Object.entries(slots).forEach(([slotName, children]) => {
          const allowedChildren = new Set(definition.slots[slotName] || []);
          children.forEach((child, index) => {
            validateNode(child, `${path}.${slotName}[${index}]`);
            if (!allowedChildren.has(child.component)) {
              throw new Error(`Component "${child.component}" is not allowed in slot "${slotName}" on "${node.component}" at ${path}`);
            }
          });
        });
      }

      function collectComponents(node, into = new Set()) {
        into.add(node.component);
        Object.values(node.slots || {}).forEach((children) => {
          children.forEach((child) => collectComponents(child, into));
        });
        return into;
      }

      function compileArchetypeView(contentArchetypeId, props = {}) {
        const contentArchetype = contentArchetypes[contentArchetypeId];
        const context = { ...(authShellLayout.defaults || {}), ...(contentArchetype.defaults || {}), ...props };
        const resolvedRegions = {};

        Object.entries(contentArchetype.regions || {}).forEach(([regionName, nodes]) => {
          resolvedRegions[regionName] = nodes.map((node) => resolveNode(node, context));
          resolvedRegions[regionName].forEach((node, index) => validateNode(node, `${regionName}[${index}]`));
        });

        const mainNodes = resolvedRegions.main || [];
        const view = mainNodes[0];
        const componentsUsed = Array.from(
          Object.values(resolvedRegions).reduce((set, nodes) => {
            nodes.forEach((node) => collectComponents(node, set));
            return set;
          }, new Set())
        ).sort();

        return {
          ok: true,
          archetypeId: contentArchetypeId,
          layoutId: authShellLayout.id,
          viewId: `ai-ui.${contentArchetypeId}`,
          target: '#auth-shell-preview',
          mode: 'replace',
          layout: {
            id: authShellLayout.id,
            regions: Object.keys(authShellLayout.regions || {}),
            rules: { ...(authShellLayout.layoutRules || {}) }
          },
          shell: {
            id: authShellLayout.id,
            intro: {
              eyebrow: context.eyebrow || '',
              headline: context.headline || '',
              supportingText: context.supportingText || ''
            },
            regions: {
              hero: [],
              main: resolvedRegions.main || [],
              aside: resolvedRegions.aside || []
            }
          },
          view,
          componentsUsed
        };
      }

      function textElement(tag, className, text) {
        const element = document.createElement(tag);
        if (className) {
          element.className = className;
        }
        if (text) {
          element.textContent = text;
        }
        return element;
      }

      function renderNode(node) {
        if (node.component === 'input') {
          const input = document.createElement('input');
          input.className = 'input';
          input.type = node.props.type || 'text';
          input.id = node.props.id || '';
          input.name = node.props.name || '';
          input.placeholder = node.props.placeholder || '';
          input.autocomplete = node.props.autocomplete || '';
          return input;
        }

        if (node.component === 'button') {
          const button = document.createElement('button');
          button.className = 'button';
          button.type = 'button';
          if (node.props.variant) {
            button.dataset.variant = node.props.variant;
          }
          button.textContent = node.props.text || 'Action';
          return button;
        }

        if (node.component === 'field') {
          const field = textElement('div', 'field');
          const label = textElement('label', 'field__label', node.props.label || '');
          if (node.props.for) {
            label.setAttribute('for', node.props.for);
          }
          if (node.props.required === 'true') {
            label.dataset.required = 'true';
          }
          const control = textElement('div', 'field__control');
          (node.slots.control || []).forEach((child) => control.appendChild(renderNode(child)));
          field.appendChild(label);
          field.appendChild(control);
          if (node.props.helper) {
            field.appendChild(textElement('p', 'field__helper', node.props.helper));
          }
          return field;
        }

        if (node.component === 'card') {
          const card = textElement('article', 'card');
          if (node.props.tone) {
            card.dataset.tone = node.props.tone;
          }
          const header = textElement('header', 'card__header');
          header.appendChild(textElement('h2', 'card__title', node.props.title || 'Untitled'));
          header.appendChild(textElement('p', 'card__description', node.props.description || ''));
          const body = textElement('div', 'card__body');
          (node.slots.body || []).forEach((child) => body.appendChild(renderNode(child)));
          const footer = textElement('footer', 'card__footer');
          (node.slots.footer || []).forEach((child) => footer.appendChild(renderNode(child)));
          card.appendChild(header);
          card.appendChild(body);
          card.appendChild(footer);
          return card;
        }

        return textElement('pre', '', `Unknown component: ${node.component}`);
      }

      function renderShell(result) {
        const shell = textElement('section', 'stack');
        shell.dataset.gap = 'lg';

        const hero = textElement('article', 'card');
        const heroHeader = textElement('header', 'card__header');
        heroHeader.appendChild(textElement('span', 'badge', result.shell.intro.eyebrow || ''));
        heroHeader.appendChild(textElement('h2', 'card__title', result.shell.intro.headline || ''));
        heroHeader.appendChild(textElement('p', 'card__description', result.shell.intro.supportingText || ''));
        hero.appendChild(heroHeader);
        shell.appendChild(hero);

        const grid = textElement('section', 'grid');
        grid.dataset.responsiveColumns = '2';
        grid.style.alignItems = 'start';

        const main = textElement('div', 'stack');
        main.dataset.gap = 'lg';
        result.shell.regions.main.forEach((node) => main.appendChild(renderNode(node)));

        const aside = textElement('aside', 'stack');
        aside.dataset.gap = 'md';
        const asideCard = textElement('article', 'card');
        asideCard.dataset.tone = 'subtle';
        const asideHeader = textElement('header', 'card__header');
        asideHeader.appendChild(textElement('h3', 'card__title', 'Shared Layout'));
        asideHeader.appendChild(textElement('p', 'card__description', 'This column comes from the `auth-shell` layout archetype, not from the content archetype.'));
        const asideBody = textElement('div', 'card__body');
        asideBody.appendChild(textElement('p', '', `Current content: ${result.archetypeId}`));
        asideBody.appendChild(textElement('p', '', `Components: ${result.componentsUsed.join(', ')}`));
        asideBody.appendChild(textElement('p', '', `Layout alignment: ${result.layout.rules.alignment}`));
        asideCard.appendChild(asideHeader);
        asideCard.appendChild(asideBody);
        aside.appendChild(asideCard);

        grid.appendChild(main);
        grid.appendChild(aside);
        shell.appendChild(grid);

        return shell;
      }

      const themeButton = document.querySelector('[data-theme-toggle]');
      const themeLabel = document.querySelector('[data-theme-label]');
      applyTheme(getCurrentTheme());
      syncThemeToggle(themeButton, themeLabel);
      themeButton.addEventListener('click', () => {
        cycleTheme();
        syncThemeToggle(themeButton, themeLabel);
      });

      const eventBus = new EventBus();
      const views = new ViewRegistry(eventBus);
      views.register({
        id: 'ai-ui.login-form',
        render: (payload) => {
          if (!payload.props || Object.keys(payload.props).length === 0) {
            return cloneResultModel(legacyViews['login-form']);
          }
          return compileArchetypeView('login-form', payload.props || {});
        }
      });
      views.register({
        id: 'ai-ui.contact-form',
        render: (payload) => {
          if (!payload.props || Object.keys(payload.props).length === 0) {
            return cloneResultModel(legacyViews['contact-form']);
          }
          return compileArchetypeView('contact-form', payload.props || {});
        }
      });

      const mount = document.querySelector('#auth-shell-preview');
      const resultJson = document.querySelector('#result-json');

      async function renderArchetype(viewId, props = {}) {
        const results = await eventBus.publish('INTENT_VIEW_RENDER', {
          viewId,
          target: '#auth-shell-preview',
          props,
          source: 'ai',
          timestamp: Date.now()
        });
        const result = results[0];
        mount.replaceChildren(renderShell(result));
        resultJson.textContent = JSON.stringify(result, null, 2);
      }

      document.querySelector('[data-open-summary]').addEventListener('click', () => {
        window.location.href = './component-summary.html';
      });

      document.querySelector('[data-show-login]').addEventListener('click', () => {
        renderArchetype('ai-ui.login-form');
      });

      document.querySelector('[data-show-login-custom]').addEventListener('click', () => {
        renderArchetype('ai-ui.login-form', {
          title: 'Welcome back',
          description: 'Continue into the CSMA preview workspace.',
          emailHelper: 'Use the account connected to your preview environment.',
          passwordHelper: 'This preview does not submit credentials.',
          submitLabel: 'Continue'
        });
      });

      document.querySelector('[data-show-contact]').addEventListener('click', () => {
        renderArchetype('ai-ui.contact-form', {
          headline: 'Talk to us',
          supportingText: 'The same shell can host a different content archetype without changing the layout contract.',
          submitLabel: 'Request demo'
        });
      });

      renderArchetype('ai-ui.login-form');
    </script>
  </body>
</html>
