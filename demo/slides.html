<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSMA Slides - Demo Deck</title>

  <!-- CSMA core (tokens + base) -->
  <link rel="stylesheet" href="../src/generated/tokens.css">
  <link rel="stylesheet" href="../src/style/base.css">
  <link rel="stylesheet" href="../src/style/foundation/layout.css">
  <link rel="stylesheet" href="../src/style/foundation/motion.css">

  <!-- Slides module CSS -->
  <link rel="stylesheet" href="../src/modules/slides/slides.css">
  <link rel="stylesheet" href="../src/modules/slides/dock.css">
  <link rel="stylesheet" href="../src/modules/slides/layouts.css">
  <link rel="stylesheet" href="../src/modules/slides/print.css">

  <!-- Shared slide-thumbnail card primitive (used by grid, rail, drawer) -->
  <link rel="stylesheet" href="../src/modules/slides/chrome/slide-thumbnail.css">

  <!-- Phase 4 — comments drawer + markers + overlay shell -->
  <link rel="stylesheet" href="../src/modules/archetypes/overlay-manager/overlay-manager.css">
  <link rel="stylesheet" href="../src/modules/comments/ui/comments-drawer.css">
  <link rel="stylesheet" href="../src/modules/comments/ui/comments-marker.css">

  <!-- Phase 3.0 — inline text editing (double-click / F2) -->
  <link rel="stylesheet" href="../src/modules/visual-editor/ui/inline-edit.css">
</head>
<body>
  <div id="deck-root"></div>

  <!-- Demo deck config - exercises every workhorse layout + a couple specialty ones -->
  <script>
    window.__DECK_CONFIG__ = {
      title: 'CSMA Slides - Demo',
      theme: { mode: 'dark' },
      slides: [
        { type: 'cover', kicker: 'Demo Deck', title: 'CSMA Slides',
          subtitle: 'A headless presentation engine for CSMA apps.',
          foot: 'Wave 2-E' },
        { type: 'big-number', kicker: 'One headline',
          value: { number: 24, suffix: '' },
          caption: 'layout factories ship in v1.',
          foot: 'See SKILL.md §3 for the selection rules.' },
        { type: 'stat-grid', kicker: 'Traction', title: 'By the numbers.',
          stats: [
            { value: { number: 842, suffix: '' }, label: 'Tests passing', caption: 'baseline + slides' },
            { value: { number: 0, suffix: '' }, label: 'New npm deps', caption: 'pure vanilla JS' },
            { value: { number: 100, suffix: '%' }, label: 'Token-driven CSS', caption: 'no raw values' }
          ] },
        { type: 'steps', kicker: 'How it works', title: 'Three steps to a deck.',
          items: [
            { title: 'Author', body: 'Write a single deck.json with one slide object per slide.' },
            { title: 'Theme', body: 'Patch tokens via token-overrides.json. The slides module reads them.' },
            { title: 'Present', body: 'Set window.__DECK_CONFIG__ and call mountDeck.' }
          ] },
        { type: 'quote', text: 'Reactive UI without a framework, a security boundary without a backend.',
          name: 'CSMA manifesto', role: 'architecture skill' },
        { type: 'comparison', kicker: 'Why this exists', title: 'Slides vs. bolt-slides.',
          cols: ['', 'CSMA Slides', 'bolt-slides'],
          highlight: 1,
          rows: [
            { label: 'Framework', values: ['Vanilla JS', 'React'] },
            { label: 'Animation', values: ['CSS + data-*', 'framer-motion'] },
            { label: 'Sync', values: ['CrossTabLeader', 'custom BroadcastChannel'] },
            { label: 'Security', values: [true, false] }
          ] },
        { type: 'cta', title: 'Ship a deck.', subtitle: 'Read SKILL.md → write deck.json → mountDeck' },
        { type: 'split',
          kicker: 'Phase 4',
          title: 'Comments on every slide',
          body: 'Click the 💬 button in the dock to open the comments drawer for the current slide. The badge shows the open-count. Add a comment, resolve it, or reply. Anchored elements get a pin marker — click a pin to focus + open a popup.'
          /* drawer + badge + markers wired in the bootstrap below */ }
      ]
    };
  </script>

  <!-- Bootstrap CSMA runtime + slides module -->
  <script type="module">
    import { EventBus } from '../src/runtime/EventBus.js';
    import { SlideDeckService, mountDeck } from '../src/modules/slides/index.js';
    import { AIUIComposerService } from '../src/modules/ai-ui/services/AIUIComposerService.js';
    import { ServiceManager } from '../src/runtime/ServiceManager.js';
    import { CommentsService } from '../src/modules/comments/services/CommentsService.js';
    // Phase 4 — anchored comments + drawer + element picker + popup
    // (import from the individual factory files, not the package index, so the
    //  demo loads over plain HTTP too — the index.js side-effect-imports CSS.)
    import { AnchorableCommentsService } from '../src/modules/comments/services/AnchorableCommentsService.js';
    import { AnchorResolver } from '../src/modules/comments/services/AnchorResolver.js';
    import { createCommentsDrawer } from '../src/modules/comments/ui/CommentsDrawer.js';
    import { createCommentsPopup } from '../src/modules/comments/ui/CommentsPopup.js';
    import { createCommentsPicker } from '../src/modules/comments/ui/CommentsPicker.js';
    import { createSlideThumbnail } from '../src/modules/slides/chrome/SlideThumbnail.js';
    import { createOverlayManager } from '../src/modules/archetypes/overlay-manager/overlay-manager.js';
    import { Storage } from '../src/modules/storage/services/Storage.js';
    import { CommentsContracts } from '../src/modules/comments/contracts/comments-contracts.js';

    const eventBus = new EventBus();
    // Register slides + comments contracts so validation passes
    const { SlidesContracts } = await import('../src/modules/slides/index.js');
    eventBus.contracts = Object.assign({}, SlidesContracts, CommentsContracts);

    // Phase 2.2 - wire CommentsService + ServiceManager + AIUIComposer so that
    // the `comments-thread` surface can mount inside a slide.
    const serviceManager = new ServiceManager();
    const comments = new CommentsService(eventBus);
    await comments.init();
    serviceManager.register('comments', comments);

    const composer = new AIUIComposerService();
    composer.setServiceManager?.(serviceManager);

    // Seed a sample comment thread so the embedded surface has content.
    // The threadId matches what SlideDeckService.toggleComments() will use by
    // default for slide index 7 (the Phase 2.2 demo slide).
    const demoThreadId = 'slide-7-q-and-a';
    comments.submit({ threadId: demoThreadId, body: 'First comment on the slide-embed demo.' });
    comments.submit({ threadId: demoThreadId, body: 'Second comment - click 💆 again to remove the surface.' });

    const service = new SlideDeckService(eventBus);
    service.init();

    // ── Phase 4 — anchorable comments + drawer + element picker ────────
    // The dock chat button becomes a drawer-opener + live count badge ONLY
    // when we pass `commentsService` into mountDeck (opt-in).
    const anchorableComments = new AnchorableCommentsService(eventBus);
    anchorableComments.setServiceManager(serviceManager);

    // Persistence: wire real IndexedDB so comments survive reload (the service
    // calls storage.init(COMMENTS_SCHEMA) internally).
    const storage = new Storage(eventBus, 'csma-db', 1);
    await anchorableComments.init({ storage });
    serviceManager.register('anchorableComments', anchorableComments);

    // Scope helpers — kept here (not in the generic drawer) so the drawer
    // never hardcodes slide semantics.
    const scopeOf = (idx) => 'deck:slide-' + (Number.isFinite(idx) ? idx : service.index);
    const scopeLabel = (scope) => {
      const m = /^deck:slide-(\d+)$/.exec(scope || '');
      return m ? 'Slide ' + (Number(m[1]) + 1) : scope;
    };
    const onScopeNavigate = (scope) => {
      const m = /^deck:slide-(\d+)$/.exec(scope || '');
      if (m) eventBus.publish('INTENT_SLIDE_GO', { index: Number(m[1]), timestamp: Date.now() });
    };

    // Overlay manager owns the drawer shell (slide-in panel + backdrop + ESC).
    const overlayManager = createOverlayManager(document.body);
    // Drawer reacts to COMMENTS_DRAWER_OPENED/CLOSED and renders the list.
    // scopeLabel renders a per-card "Slide N" chip; onScopeNavigate jumps to
    // that slide when the chip is clicked. enableElementPicker adds a
    // "Comment on element" button that hands off to the picker below.
    const commentsDrawer = createCommentsDrawer({
      eventBus, service: anchorableComments, overlayManager,
      scopeLabel, onScopeNavigate, enableElementPicker: true,
      scopeRail: {
        render: (railContainer) => {
          const cleanups = [];
          const slides = service.slides || [];
          for (let i = 0; i < slides.length; i++) {
            const { root, cleanup } = createSlideThumbnail(slides[i], {
              index: i,
              tag: 'button',
              label: 'Slide ' + (i + 1),
              documentRef: document
            });
            if (root) {
              root.dataset.scope = scopeOf(i);
              railContainer.appendChild(root);
              cleanups.push(cleanup);
            }
          }
          return () => cleanups.forEach((fn) => { try { fn(); } catch { /* best-effort */ } });
        }
      }
    });

    // Anchor resolver + popup: a comment's "locate" action opens a popover at
    // the element it is anchored to (via INTENT_COMMENTS_FOCUS).
    const resolver = new AnchorResolver();
    const commentsPopup = createCommentsPopup({ eventBus, service: anchorableComments, overlayManager, resolver });

    // Seed a couple of scope-level comments ONLY on first run (empty store) so
    // reloads keep user-added comments instead of duplicating the seeds.
    if (anchorableComments.comments.size === 0) {
      anchorableComments.add({
        scope: 'deck:slide-0',
        anchor: { anchor_type: 'element', anchor: { selector: '[data-comments-scope="deck:slide-0"]' } },
        body: 'Welcome — open the drawer (chat button), or click "Element" to comment on a specific part of this slide.',
        author: { name: 'Demo' }
      });
      anchorableComments.add({
        scope: 'deck:slide-1',
        anchor: { anchor_type: 'element', anchor: { selector: '[data-comments-scope="deck:slide-1"]' } },
        body: 'Review: is 24 the right number to headline here?',
        author: { name: 'Reviewer' }
      });
    }

    // Opt into drawer mode: the dock chat button now opens the drawer + shows a badge.
    mountDeck(document.getElementById('deck-root'), service, eventBus, { composer, commentsService: anchorableComments, enableUndoRedo: true });

    // Element picker: click "Element" in the drawer, then click any slide
    // content to start a comment anchored to that exact element. Bound to the
    // deck root so the dock/rail chrome is never a pick target.
    const deckRoot = document.getElementById('deck-root');
    const commentsPicker = createCommentsPicker({
      eventBus, container: deckRoot, getScope: () => scopeOf(service.index), overlayManager
    });

    // ── Phase 3.0 — inline text editing (double-click or F2) ────────
    import { createInlineTextEditor } from '../src/modules/visual-editor/ui/InlineTextEditor.js';
    const enableEditLogging = true; // auto-log confirmed edits as system comments
    const inlineEditor = createInlineTextEditor({
      container: deckRoot,
      eventBus,
      filter: (el) => !el.closest('.noir-dock, .slide-rail, .slide-grid, .csma-overlay-backdrop, .csma-comments-') // skip chrome
    });

    // ── Auto-log confirmed edits as system comments ──────────────
    if (enableEditLogging) {
      // Text edits: create a system comment when user saves an inline text change
      eventBus.subscribe('INTENT_ELEMENT_EDITED', ({ elementId, tagName, value, previousValue }) => {
        const scope = scopeOf(service.index);
        if (!elementId || !value || value === previousValue) return;
        const elLabel = tagName ? `<${tagName}>` : 'text';
        const truncated = (s) => s.length > 60 ? s.slice(0, 57) + '…' : s;
        anchorableComments.add({
          scope,
          anchor: { anchor_type: 'element', anchor: { id: elementId } },
          body: `Changed ${elLabel} from "${truncated(previousValue)}" to "${truncated(value)}"`,
          author: { name: 'System' },
          type: 'system',
          status: 'resolved'  // auto-resolved: informational only, no review needed
        });
      });
      // Drawing strokes: create an annotation comment (type 'annotation', not 'system')
      // so it appears in "Open" for review and can be resolved to hide the stroke.
      eventBus.subscribe('INTENT_ANNOTATION_STROKE', (payload) => {
        const scope = scopeOf(service.index);
        const pointCount = payload?.points?.length || 0;
        if (pointCount === 0) return;
        const strokeId = service._lastStrokeId;
        if (!strokeId) return;
        anchorableComments.add({
          scope,
          anchor: { anchor_type: 'element', anchor: { id: strokeId } },
          body: 'Drew an annotation (' + pointCount + ' point' + (pointCount !== 1 ? 's' : '') + ')',
          author: { name: 'System' },
          type: 'annotation',
          data: { strokeId }  // for resolve/reopen/delete → hide/show/remove stroke
        });
      });
      // Delete annotation comment → remove the stroke from the slide
      eventBus.subscribe('COMMENT_REMOVED', (payload) => {
        const commentId = payload?.id;
        if (!commentId) return;
        const comment = anchorableComments.comments.get(String(commentId));
        if (!comment || comment.type !== 'annotation') return;
        const strokeId = comment?.data?.strokeId;
        if (strokeId) service.removeStrokeById(strokeId);
      });
      // Delete stroke via keyboard → remove the linked comment
      eventBus.subscribe('INTENT_ANNOTATION_STROKE_DELETE', (payload) => {
        const strokeId = payload?.strokeId;
        if (!strokeId) return;
        for (const c of anchorableComments.comments.values()) {
          if (c.data?.strokeId === strokeId && c.status !== 'deleted') {
            anchorableComments.delete(c.id);
            break;
          }
        }
      });
      // Resolve drawing comment → hide the stroke from the slide
      eventBus.subscribe('COMMENT_RESOLVED', (payload) => {
        const comment = anchorableComments.comments.get(String(payload?.id));
        if (comment?.data?.strokeId) service.hideStroke(comment.data.strokeId);
      });
      // Reopen drawing comment → show the stroke again
      eventBus.subscribe('COMMENT_REOPENED', (payload) => {
        const comment = anchorableComments.comments.get(String(payload?.id));
        if (comment?.data?.strokeId) service.showStroke(comment.data.strokeId);
      });
      // 📍 Pin click → highlight the element (stroke or text) on the slide
      eventBus.subscribe('INTENT_COMMENTS_FOCUS', (payload) => {
        const comment = anchorableComments.comments.get(String(payload?.id));
        if (!comment) return;
        // Drawing stroke highlight
        const strokeId = comment?.data?.strokeId;
        if (strokeId) {
          const path = document.getElementById(strokeId);
          if (path) {
            path.dataset.highlighted = 'true';
            try { path.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch { /* best-effort */ }
            setTimeout(() => { if (path) path.dataset.highlighted = 'false'; }, 2000);
            return;
          }
        }
        // Text element highlight (for text edit system comments)
        const anchorId = comment?.anchor?.id;
        if (anchorId) {
          const el = document.getElementById(anchorId);
          if (el) {
            el.classList.add('csma-inline-edit-active');
            try { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch { /* best-effort */ }
            setTimeout(() => el.classList.remove('csma-inline-edit-active'), 2000);
          }
        }
      });
    }

    // Listen for inline edits and update the slide config in-memory
    eventBus.subscribe('INTENT_ELEMENT_EDITED', ({ elementId, value, previousValue }) => {
      console.log('[inline-edit] text saved', { elementId, value, previousValue });
    });

    // Expose for debugging
    window.deck = { service, eventBus, comments, anchorableComments, commentsDrawer, commentsPopup, commentsPicker, overlayManager, composer, inlineEditor };

    // Phase 2.2 diagnostics - log the wiring state so users can verify in console
    console.log('[Phase 2.2] wiring:', {
      commentsRegistered: serviceManager.get('comments') === comments,
      composerHasServiceManager: !!composer.serviceManager,
      seededComments: comments.getComments('slide-5-q-and-a').length,
      dockHasCommentsBtn: true
    });
    // Reflect 💆 button active state when current slide has comments media
    eventBus.subscribe('SLIDE_MEDIA_CHANGED', () => updateCommentsBtnState());
    eventBus.subscribe('SLIDE_CHANGED', () => updateCommentsBtnState());
    function updateCommentsBtnState() {
      const btn = document.querySelector('.dock-btn[data-intent="INTENT_SLIDE_TOGGLE_COMMENTS"]');
      if (!btn) return;
      const media = service.getCurrentSlide()?.media;
      const active = media?.type === 'surface' && media?.component === 'comments-thread';
      btn.dataset.active = active ? 'true' : 'false';
      btn.setAttribute('aria-pressed', active ? 'true' : 'false');
    }
    updateCommentsBtnState();
  </script>
</body>
</html>
