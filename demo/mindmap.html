<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; connect-src 'self'"
  />
  <title>mindmap - demo v2</title>
  <link rel="stylesheet" href="/src/generated/tokens.css" />
  <!-- CSMA catalog components mapped from the demo's legacy .mm-node / .mm-connector -->
  <link rel="stylesheet" href="/src/ui/components/mind-node/mind-node.css" />
  <link rel="stylesheet" href="/src/ui/components/connector-line/connector-line.css" />
  <link rel="stylesheet" href="/src/ui/components/button/button.css" />
  <link rel="stylesheet" href="/src/ui/components/theme-toggle/theme-toggle.css" />
  <link rel="stylesheet" href="/src/style/base.css" />
  <link rel="stylesheet" href="/src/style/foundation/layout.css" />
  <link rel="stylesheet" href="/src/style/foundation/motion.css" />
  <link rel="stylesheet" href="mindmap.css" />
</head>
<body>
  <h1>mindmap - demo v2</h1>
  <div class="toolbar">
    <button id="new-map" class="button" data-variant="ghost" data-size="sm">+ new map</button>
    <select id="map-select"></select>
    <button id="undo-btn" class="button" data-variant="ghost" data-size="sm">undo</button>
    <button id="redo-btn" class="button" data-variant="ghost" data-size="sm">redo</button>
    <button id="md-btn" class="button" data-variant="ghost" data-size="sm">md</button>
    <button class="theme-toggle" type="button" data-theme-toggle data-theme-active="light" aria-label="Switch theme">
      <span class="theme-toggle__icons" aria-hidden="true">
        <span class="theme-icon theme-icon--sun">☀</span>
        <span class="theme-icon theme-icon--moon">◐</span>
        <span class="theme-icon theme-icon--contrast">◫</span>
      </span>
      <span class="theme-toggle__label" data-theme-label>Theme: Light</span>
    </button>
  </div>
  <div class="canvas" id="canvas" tabindex="0"></div>
  <pre class="status-line" id="status">Loading…</pre>

  <script type="module" src="mindmap.js"></script>
</body>
</html>
