<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>branch-node - demo</title>
  <link rel="stylesheet" href="../../../generated/tokens.css" />
  <link rel="stylesheet" href="../index.css" />
  <link rel="stylesheet" href="branch-node.css" />
  <link rel="stylesheet" href="../leaf-node/leaf-node.css" />
</head>
<body>
  <main class="demo-canvas">
    <h1>branch-node demo</h1>
    <section>
      <h2>pending</h2>
      <div class="branch-node" data-status="pending" data-tag="module">
        <div class="branch-node__header">
          <span class="branch-node__status"></span>
          <span class="branch-node__topic">init + plan</span>
          <span class="branch-node__tag">module</span>
          <button class="branch-node__collapse" aria-label="Collapse" type="button"></button>
        </div>
        <div class="branch-node__leaves" data-slot="leaves"></div>
        <div class="branch-node__actions"><span class="branch-node__count">0/2</span></div>
      </div>
    </section>
    <section>
      <h2>in_progress</h2>
      <div class="branch-node" data-status="in_progress" data-tag="phase">
        <div class="branch-node__header">
          <span class="branch-node__status"></span>
          <span class="branch-node__topic">e2e-test</span>
          <span class="branch-node__tag">phase</span>
          <button class="branch-node__collapse" aria-label="Collapse" type="button"></button>
        </div>
        <div class="branch-node__leaves" data-slot="leaves"></div>
        <div class="branch-node__actions"><span class="branch-node__count">3/5</span></div>
      </div>
    </section>
    <section>
      <h2>done</h2>
      <div class="branch-node" data-status="done" data-tag="feature" data-collapsed="true" data-child-count="4">
        <div class="branch-node__header">
          <span class="branch-node__status"></span>
          <span class="branch-node__topic">shipped</span>
          <span class="branch-node__tag">feature</span>
          <button class="branch-node__collapse" aria-label="Collapse" type="button"></button>
        </div>
        <div class="branch-node__leaves" data-slot="leaves"></div>
        <div class="branch-node__actions"><span class="branch-node__count">4/4</span></div>
      </div>
    </section>
    <section>
      <h2>blocked</h2>
      <div class="branch-node" data-status="blocked" data-tag="research">
        <div class="branch-node__header">
          <span class="branch-node__status"></span>
          <span class="branch-node__topic">waiting on upstream</span>
          <span class="branch-node__tag">research</span>
          <button class="branch-node__collapse" aria-label="Collapse" type="button"></button>
        </div>
        <div class="branch-node__leaves" data-slot="leaves"></div>
        <div class="branch-node__actions"><span class="branch-node__count">0/1</span></div>
      </div>
    </section>
  </main>
</body>
</html>
