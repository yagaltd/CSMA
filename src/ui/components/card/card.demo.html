<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Card Demo</title>
    <link rel="stylesheet" href="../../../style/main.css" />
  </head>
  <body>
    <main class="stack" data-gap="lg" style="max-width: 32rem; margin: 2rem auto;">
      <article class="card">
        <header class="card__header">
          <h1 class="card__title">Sign in</h1>
          <p class="card__description">Use your work email and password to continue.</p>
        </header>
        <div class="card__body">
          <div class="badge" data-variant="soft-info">Preview content</div>
        </div>
        <footer class="card__footer">
          <button class="button" data-variant="ghost">Cancel</button>
          <button class="button" data-variant="primary">Continue</button>
        </footer>
      </article>
    </main>
  </body>
</html>
