<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shortcut List Demo</title>
    <link rel="stylesheet" href="../../../style/main.css" />
    <link rel="stylesheet" href="../shortcut-row/shortcut-row.css" />
    <link rel="stylesheet" href="./shortcut-list.css" />
  </head>
  <body>
    <main class="stack" data-gap="lg" style="max-width: 24rem; margin: 2rem auto;">
      <h1 class="section-header__title">Shortcut List</h1>
      <p class="section-header__description">Keyboard shortcut reference entries.</p>
      <div class="shortcut-list">
        <div class="shortcut-row"><kbd>Ctrl</kbd> + <kbd>S</kbd><span>Save</span></div>
        <div class="shortcut-row"><kbd>Ctrl</kbd> + <kbd>Z</kbd><span>Undo</span></div>
      </div>
    </main>
  </body>
</html>
