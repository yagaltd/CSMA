<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tilt Card Demo</title>
    <link rel="stylesheet" href="../../../style/main.css" />
    <link rel="stylesheet" href="./tilt-card.css" />
  </head>
  <body>
    <main class="stack" data-gap="lg" style="max-width: 24rem; margin: 2rem auto; perspective: 800px;">
      <h1 class="section-header__title">Tilt Card</h1>
      <p class="section-header__description">Perspective tilt toward the pointer on hover.</p>
      <div class="tilt-card" data-tilt>
        <h2 class="tilt-card__title">Tilt me</h2>
        <p class="tilt-card__description">Move the pointer across this card to see the tilt.</p>
      </div>
    </main>
  </body>
</html>
