<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Input Demo</title>
    <link rel="stylesheet" href="../../../style/main.css" />
  </head>
  <body>
    <main class="stack" data-gap="lg" style="max-width: 28rem; margin: 2rem auto;">
      <label class="stack" data-gap="sm">
        <span>Email</span>
        <input class="input" type="email" placeholder="name@company.com" autocomplete="email" />
      </label>
      <label class="stack" data-gap="sm">
        <span>Password</span>
        <input class="input" type="password" placeholder="Enter your password" />
      </label>
    </main>
  </body>
</html>
