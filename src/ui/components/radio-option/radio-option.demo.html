<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Radio Option Demo</title>
    <link rel="stylesheet" href="../../../style/main.css" />
    <link rel="stylesheet" href="./radio-option.css" />
  </head>
  <body>
    <main class="stack" data-gap="lg" style="max-width: 24rem; margin: 2rem auto;">
      <h1 class="section-header__title">Radio Option</h1>
      <p class="section-header__description">Single radio input paired with a label.</p>
      <label class="radio-option"><input type="radio" name="opt" value="a" checked /><span>Option A</span></label>
      <label class="radio-option"><input type="radio" name="opt" value="b" /><span>Option B</span></label>
    </main>
  </body>
</html>
