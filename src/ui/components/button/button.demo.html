<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Button Component Demo</title>
    <link rel="stylesheet" href="../../../style/main.css" />
  </head>
  <body>
    <main class="stack" data-gap="xl" style="max-width: 56rem; margin: 2rem auto; padding: 0 1rem;">
      <header class="stack" data-gap="sm">
        <h1>Button</h1>
        <p class="text-muted">Foundation button variants and states used across CSMA previews.</p>
      </header>

      <section class="stack" data-gap="md">
        <h2>Variants</h2>
        <div class="cluster">
          <button class="button">Default</button>
          <button class="button" data-variant="primary">Primary</button>
          <button class="button" data-variant="secondary">Secondary</button>
          <button class="button" data-variant="ghost">Ghost</button>
          <button class="button" data-variant="outline">Outline</button>
          <button class="button" data-variant="destructive">Destructive</button>
        </div>
      </section>

      <section class="stack" data-gap="md">
        <h2>Sizes</h2>
        <div class="cluster">
          <button class="button" data-size="sm">Small</button>
          <button class="button">Default</button>
          <button class="button" data-size="lg">Large</button>
          <button class="button" data-shape="icon" aria-label="Create new item">+</button>
        </div>
      </section>

      <section class="stack" data-gap="md">
        <h2>States</h2>
        <div class="cluster">
          <button class="button" disabled>Disabled</button>
          <button class="button" data-variant="primary" data-state="loading">Loading</button>
        </div>
      </section>
    </main>
  </body>
</html>
