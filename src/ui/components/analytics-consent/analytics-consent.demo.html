<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../theme-loader.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics Consent Demo - CSMA</title>
  <link rel="stylesheet" href="../../../css/main.css">
  <style>
    body { padding: 2rem; max-width: 960px; margin: 0 auto; background: var(--background); color: var(--foreground); }
    .back-link { display: inline-block; margin-bottom: 1rem; color: var(--primary); text-decoration: none; }
    .demo-intro { color: var(--foreground-muted); line-height: 1.6; margin-bottom: 1.5rem; max-width: 70ch; }
    .demo-grid { display: grid; gap: var(--space-xl); }
    .demo-grid-two-up { grid-template-columns: repeat(auto-fit, minmax(18rem, 1fr)); }
    .demo-card { padding: var(--space-xl); border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); display: grid; gap: var(--space-lg); }
    .demo-card-fluid { max-width: 100%; }
    .demo-copy { color: var(--foreground-muted); line-height: 1.6; }
    .demo-placeholder, .demo-target { min-height: 10rem; display: grid; place-items: center; border-radius: var(--radius-md); background: var(--surface-muted); color: var(--foreground-muted); }
    .analytics-consent-card, .analytics-consent-panel { display: grid; gap: var(--space-md); }
    .analytics-consent-modal[data-open="true"] { display: block; }
    .analytics-consent-modal { display: none; }
    .analytics-consent-panel { padding: var(--space-xl); border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); }
    .analytics-consent-actions, .calendar-month-year, .slider-range-values { display: flex; gap: var(--space-sm); align-items: center; justify-content: space-between; }
    .analytics-consent-row { display: flex; align-items: center; gap: var(--space-sm); }
  </style>
</head>
<body class="">
  <a href="../index.html#analytics-consent" class="back-link">← Back to Explorer</a>
  <h1>Analytics Consent</h1>
  <p class="demo-intro">Consent center and modal controls wired to a local mock consent service.</p>
  
<section class="demo-card">
  <h2>Consent center</h2>
  <div class="analytics-consent-card" data-consent-center>
    <label class="analytics-consent-row"><input type="checkbox" data-consent-toggle="analytics" data-consent-label="Analytics"> Analytics</label>
    <label class="analytics-consent-row"><input type="checkbox" data-consent-toggle="product" data-consent-label="Product research"> Product research</label>
    <p class="analytics-consent-status" data-consent-status aria-live="polite"></p>
    <div class="analytics-consent-actions">
      <button class="button" type="button" data-consent-open="#consent-modal">Open modal</button>
      <button class="button" data-variant="ghost" type="button" data-consent-clear>Clear</button>
    </div>
  </div>
</section>
<section class="demo-card">
  <div class="analytics-consent-modal" id="consent-modal" data-consent-modal>
    <div class="analytics-consent-panel">
      <h2>Telemetry preferences</h2>
      <p class="demo-copy">Choose which optional signals this local demo stores.</p>
      <label class="analytics-consent-row"><input type="checkbox" data-consent-toggle="analytics" data-consent-label="Analytics"> Analytics</label>
      <label class="analytics-consent-row"><input type="checkbox" data-consent-toggle="product" data-consent-label="Product research"> Product research</label>
      <p class="analytics-consent-status" data-consent-status aria-live="polite"></p>
      <div class="analytics-consent-actions">
        <button class="button" data-variant="primary" type="button" data-consent-accept>Save</button>
        <button class="button" data-variant="ghost" type="button" data-consent-close>Close</button>
      </div>
    </div>
  </div>
</section>
  <script type="module">

import { initAnalyticsConsentControls } from './analytics-consent.js';
window.csma = window.csma || {};
const consentState = new Map([['analytics', true], ['product', false]]);
window.csma.analyticsConsent = {
  getConsent(scope) { return consentState.get(scope) || false; },
  setConsent(scope, value) { consentState.set(scope, Boolean(value)); },
  clearTelemetry() { consentState.clear(); },
  acknowledge() {}
};
initAnalyticsConsentControls();
  </script>
</body>
</html>
