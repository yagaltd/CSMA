<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Badge Component Demo</title>
    <link rel="stylesheet" href="../../../style/main.css" />
  </head>
  <body>
    <main class="stack" data-gap="xl" style="max-width: 56rem; margin: 2rem auto; padding: 0 1rem;">
      <header class="stack" data-gap="sm">
        <h1>Badge</h1>
        <p class="text-muted">Inline labels for status, categories, and small counts.</p>
      </header>

      <section class="stack" data-gap="md">
        <h2>Variants</h2>
        <div class="cluster">
          <span class="badge" data-variant="muted">Default</span>
          <span class="badge" data-variant="primary">Primary</span>
          <span class="badge" data-variant="secondary">Secondary</span>
          <span class="badge" data-variant="danger">Destructive</span>
          <span class="badge" data-variant="outline">Outline</span>
        </div>
      </section>

      <section class="stack" data-gap="md">
        <h2>Soft Variants</h2>
        <div class="cluster">
          <span class="badge" data-variant="soft-primary">Primary</span>
          <span class="badge" data-variant="soft-success">Success</span>
          <span class="badge" data-variant="soft-warning">Warning</span>
          <span class="badge" data-variant="soft-danger">Danger</span>
          <span class="badge" data-variant="soft-info">Info</span>
        </div>
      </section>

      <section class="stack" data-gap="md">
        <h2>Sizes And Dots</h2>
        <div class="cluster">
          <span class="badge" data-variant="primary" data-size="sm">Small</span>
          <span class="badge" data-variant="primary" data-size="md">Medium</span>
          <span class="badge" data-variant="primary" data-size="lg">Large</span>
          <span class="badge" data-variant="success" data-leading-dot="true">Active</span>
          <span class="badge" data-variant="warning" data-leading-dot="true">Pending</span>
        </div>
      </section>
    </main>
  </body>
</html>
