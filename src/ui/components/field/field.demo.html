<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Field Demo</title>
    <link rel="stylesheet" href="../../../style/main.css" />
  </head>
  <body>
    <main class="stack" data-gap="lg" style="max-width: 28rem; margin: 2rem auto;">
      <div class="field">
        <label class="field__label" data-required="true" for="demo-email">Work email</label>
        <div class="field__control">
          <input class="input" id="demo-email" type="email" placeholder="name@company.com" />
          <p class="field__helper">We use this to find your workspace.</p>
        </div>
      </div>
    </main>
  </body>
</html>
