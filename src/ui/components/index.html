<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>CSMA Components</title>

        <link rel="stylesheet" href="../../css/main.css" />
        <link rel="stylesheet" href="index.css" />

        <style>
            :root {
                --explorer-search-radius: var(--radius-sm);
                --explorer-search-focus-ring: 0 0 0 2px var(--primary-soft);
                --explorer-nav-bg: var(--surface-muted);
                --explorer-nav-hover-bg: var(--primary);
                --explorer-nav-hover-fg: var(--primary-foreground);
                --explorer-nav-hover-border: var(--primary);
                --explorer-nav-hover-shadow: 0 10px 18px color-mix(in srgb, var(--primary) 16%, transparent);
                --explorer-nav-radius: var(--radius-sm);
                --explorer-toggle-size: 2.75rem;
                --explorer-toggle-radius: var(--radius-sm);
                --explorer-toggle-bg: var(--surface-muted);
                --explorer-toggle-hover-bg: var(--primary);
                --explorer-toggle-hover-fg: var(--primary-foreground);
                --explorer-toggle-hover-border: var(--primary);
                --explorer-toggle-hover-shadow: 0 10px 18px color-mix(in srgb, var(--primary) 14%, transparent);
                --explorer-sidebar-link-hover-bg: var(--primary);
                --explorer-sidebar-link-hover-fg: var(--primary-foreground);
                --explorer-sidebar-link-hover-border: var(--primary);
                --explorer-sidebar-link-active-bg: var(--surface-muted);
                --explorer-sidebar-link-active-fg: var(--foreground);
                --explorer-sidebar-link-active-border: var(--info);
                --explorer-sidebar-link-border-width: 3px;
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                padding: 0;
                background: var(--background);
                color: var(--foreground);
                font-family: var(--font-family-base);
                overflow: hidden;
            }

            @media (prefers-reduced-motion: no-preference) {
                .explorer-main {
                    animation: mainEnter var(--motion-duration-enter) var(--ease-out-expo) backwards;
                }

                @keyframes mainEnter {
                    from {
                        opacity: 0;
                        transform: translateY(12px);
                    }
                }
            }
        </style>
    </head>

    <body>
        <header class="explorer-header">
            <button
                class="sidebar-toggle"
                id="sidebarToggle"
                type="button"
                aria-label="Toggle sidebar"
            >
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>

            <div class="explorer-logo" aria-label="CSMA Components">
                CSMA Components
            </div>

            <div class="explorer-search">
                <label class="visually-hidden" for="searchInput">Search components</label>
                <svg class="explorer-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
                <input type="search" id="searchInput" placeholder="Search..." autocomplete="off" />
            </div>

            <div class="explorer-header-actions">
                <a class="nav-link" href="../patterns/index.html" rel="noreferrer">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                    </svg>
                    Patterns
                </a>
                <button class="theme-toggle" id="themeToggle" type="button" data-theme-toggle aria-label="Toggle theme">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="theme-toggle-icon icon-sun">
                        <circle cx="12" cy="12" r="4"></circle>
                        <path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path>
                    </svg>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="theme-toggle-icon icon-moon" hidden>
                        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
                    </svg>
                </button>
            </div>
        </header>

        <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

        <aside class="explorer-sidebar" id="sidebar">
            <nav class="sidebar-section" id="sidebarNav"></nav>
        </aside>

        <main class="explorer-main" id="mainContent"></main>

        <script type="module">
            import { componentRegistry } from './component-registry.js';
            import { initUI } from '../init.js';
            import { EventBus } from '../../runtime/EventBus.js';
            import { Contracts } from '../../runtime/Contracts.js';

            // Initialize EventBus (persists across component switches)
            const eventBus = new EventBus();
            eventBus.contracts = Contracts;
            window.csma = window.csma || {};
            window.csma.explorerBus = eventBus;

            // State
            let uiCleanup = () => {};
            let activeComponentId = null;

            // DOM refs
            const themeToggle = document.getElementById('themeToggle');
            const header = document.querySelector('.explorer-header');
            const html = document.documentElement;
            const iconSun = themeToggle.querySelector('.icon-sun');
            const iconMoon = themeToggle.querySelector('.icon-moon');
            const sidebarToggle = document.getElementById('sidebarToggle');
            const sidebar = document.getElementById('sidebar');
            const sidebarBackdrop = document.getElementById('sidebarBackdrop');
            const main = document.getElementById('mainContent');
            const searchInput = document.getElementById('searchInput');
            const sidebarNav = document.getElementById('sidebarNav');

            // Theme initialization
            const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            const savedTheme = localStorage.getItem('theme') || systemTheme;
            html.dataset.theme = savedTheme;
            updateThemeIcon(savedTheme);

            themeToggle.addEventListener('click', () => {
                requestAnimationFrame(() => {
                    updateThemeIcon(html.dataset.theme || localStorage.getItem('theme') || 'light');
                });
            });

            function updateThemeIcon(theme) {
                iconSun.hidden = theme !== 'dark';
                iconMoon.hidden = theme === 'dark';
            }

            // Header height sync
            function syncHeaderHeight() {
                document.documentElement.style.setProperty('--header-height', `${header.offsetHeight}px`);
            }
            syncHeaderHeight();
            window.addEventListener('resize', syncHeaderHeight);

            // Sidebar toggle
            function setSidebarOpen(isOpen) {
                sidebar.classList.toggle('open', isOpen);
                sidebarBackdrop.classList.toggle('open', isOpen);
            }
            sidebarToggle.addEventListener('click', () => setSidebarOpen(!sidebar.classList.contains('open')));
            sidebarBackdrop.addEventListener('click', () => setSidebarOpen(false));

            // Render sidebar navigation
            function renderSidebar(filter = '') {
                sidebarNav.innerHTML = '';

                const categories = {};
                const categoryOrder = ['CSS-Only', 'Form', 'Interactive', 'Overlay', 'Navigation', 'Data', 'Layout'];

                componentRegistry.forEach((comp) => {
                    if (!matchesFilter(comp, filter)) return;
                    if (!categories[comp.category]) categories[comp.category] = [];
                    categories[comp.category].push(comp);
                });

                categoryOrder.forEach((cat) => {
                    if (!categories[cat]) return;

                    const section = document.createElement('div');
                    section.className = 'sidebar-section';

                    const title = document.createElement('div');
                    title.className = 'sidebar-section-title';
                    title.textContent = cat;
                    section.appendChild(title);

                    const list = document.createElement('ul');
                    list.className = 'sidebar-nav';

                    categories[cat].forEach((comp) => {
                        const item = document.createElement('li');
                        item.className = 'sidebar-nav-item';

                        const link = document.createElement('a');
                        link.href = `#${comp.id}`;
                        link.className = 'sidebar-nav-link';
                        link.dataset.id = comp.id;
                        link.textContent = comp.name;

                        link.addEventListener('click', (e) => {
                            e.preventDefault();
                            navigateToComponent(comp.id);
                            setSidebarOpen(false);
                        });

                        item.appendChild(link);
                        list.appendChild(item);
                    });

                    section.appendChild(list);
                    sidebarNav.appendChild(section);
                });

                if (Object.keys(categories).length === 0) {
                    sidebarNav.innerHTML = '<div class="no-results"><p>No components found</p></div>';
                }
            }

            function matchesFilter(comp, filter) {
                if (!filter) return true;
                const query = filter.toLowerCase();
                return comp.name.toLowerCase().includes(query) || comp.description.toLowerCase().includes(query);
            }

            // Navigate to component
            function navigateToComponent(id) {
                const comp = componentRegistry.find(c => c.id === id);
                if (!comp) {
                    // Fallback to first component
                    const first = componentRegistry[0];
                    if (first) navigateToComponent(first.id);
                    return;
                }

                // Cleanup previous
                if (uiCleanup) {
                    try { uiCleanup(); } catch (e) { console.error('[Showcase] Cleanup failed:', e); }
                }

                // Update state
                activeComponentId = id;
                window.location.hash = id;

                // Update sidebar active state
                document.querySelectorAll('.sidebar-nav-link').forEach((link) => {
                    link.classList.toggle('active', link.dataset.id === id);
                });

                // Render component
                renderComponent(comp);
            }

            // Render component in main area
            function renderComponent(comp) {
                try {
                    main.innerHTML = `
                        <div class="showcase-view">
                            <div class="showcase-header">
                                <h1 class="showcase-title">${comp.name}</h1>
                            </div>
                            <div class="showcase-canvas">
                                <div class="showcase-demo">
                                    ${comp.preview || comp.html}
                                </div>
                            </div>
                        </div>
                    `;

                    // Initialize component JS
                    uiCleanup = initUI(eventBus) || (() => {});
                } catch (error) {
                    console.error('[Showcase] Render failed:', error);
                    main.innerHTML = `
                        <div class="showcase-view">
                            <div class="showcase-canvas">
                                <div class="showcase-error">
                                    Failed to render component: ${error.message}
                                </div>
                            </div>
                        </div>
                    `;
                }
            }

            // Show empty state
            function showEmptyState(filter) {
                main.innerHTML = `
                    <div class="showcase-empty">
                        <svg class="showcase-empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <path d="m21 21-4.35-4.35"></path>
                        </svg>
                        <p class="showcase-empty-text">No components found matching "${filter}"</p>
                    </div>
                `;
            }

            // Search handler
            let searchTimeout;
            searchInput.addEventListener('input', (e) => {
                clearTimeout(searchTimeout);
                const filter = e.target.value.trim();
                searchTimeout = setTimeout(() => {
                    renderSidebar(filter);

                    if (!filter) {
                        // No filter: ensure a component is shown
                        if (!activeComponentId) {
                            navigateToComponent(componentRegistry[0].id);
                        }
                        return;
                    }

                    // Find matching components
                    const matches = componentRegistry.filter(c => matchesFilter(c, filter));
                    if (matches.length === 0) {
                        showEmptyState(filter);
                        activeComponentId = null;
                    } else if (matches.length === 1) {
                        navigateToComponent(matches[0].id);
                    } else {
                        // Multiple matches: navigate to first if current doesn't match
                        if (!activeComponentId || !matches.find(c => c.id === activeComponentId)) {
                            navigateToComponent(matches[0].id);
                        }
                    }
                }, 200);
            });

            // Hash change handler
            window.addEventListener('hashchange', () => {
                const id = window.location.hash.slice(1);
                if (id && id !== activeComponentId) {
                    navigateToComponent(id);
                }
            });

            // Initial load
            function init() {
                renderSidebar('');

                const hashId = window.location.hash.slice(1);
                if (hashId && componentRegistry.find(c => c.id === hashId)) {
                    navigateToComponent(hashId);
                } else if (componentRegistry.length > 0) {
                    navigateToComponent(componentRegistry[0].id);
                }
            }

            init();
        </script>
    </body>
</html>
