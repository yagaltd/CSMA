<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>mind-node - demo</title>
  <link rel="stylesheet" href="/src/generated/tokens.css" />
  <link rel="stylesheet" href="mind-node.css" />
  <link rel="stylesheet" href="../connector-line/connector-line.css" />
  <style>
    body { font-family: system-ui, sans-serif; padding: 24px; background: var(--background, #fff); color: var(--foreground, #111); }
    .row { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; margin-bottom: 24px; }
    h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .06em; color: var(--foreground-muted); }
  </style>
</head>
<body>
  <h1>mind-node demo</h1>

  <h2>leaves (no children, data-has-children absent)</h2>
  <div class="row">
    <div class="mind-node" data-status="pending" data-bottleneck="standard">
      <span class="mind-node__status"></span><span class="mind-node__topic">test /morphmap-review</span>
    </div>
    <div class="mind-node" data-status="in_progress">
      <span class="mind-node__status"></span><span class="mind-node__topic">scout: recon</span>
    </div>
    <div class="mind-node" data-status="done">
      <span class="mind-node__status"></span><span class="mind-node__topic">init + plan verified</span>
    </div>
    <div class="mind-node" data-status="blocked" data-bottleneck="risky">
      <span class="mind-node__status"></span><span class="mind-node__topic">waiting on auth token</span>
    </div>
    <div class="mind-node" data-status="failed" data-bottleneck="blocking">
      <span class="mind-node__status"></span><span class="mind-node__topic">test /morphmap-review</span>
    </div>
  </div>

  <h2>branches (data-has-children) + root</h2>
  <div class="row">
    <div class="mind-node" data-kind="root" data-status="in_progress" data-tag="phase">
      <span class="mind-node__status"></span><span class="mind-node__topic">e2e-test</span>
      <span class="mind-node__tag">phase</span>
      <button class="mind-node__collapse" aria-label="Collapse" type="button"></button>
      <span class="mind-node__count">3/5</span>
    </div>
    <div class="mind-node" data-has-children data-status="done" data-tag="feature" data-collapsed="true" data-child-count="4">
      <span class="mind-node__status"></span><span class="mind-node__topic">shipped</span>
      <span class="mind-node__tag">feature</span>
      <button class="mind-node__collapse" aria-label="Collapse" type="button"></button>
      <span class="mind-node__count">4/4</span>
    </div>
    <div class="mind-node" data-has-children data-status="blocked" data-tag="research">
      <span class="mind-node__status"></span><span class="mind-node__topic">waiting on upstream</span>
      <span class="mind-node__tag">research</span>
      <button class="mind-node__collapse" aria-label="Collapse" type="button"></button>
      <span class="mind-node__count">0/1</span>
    </div>
  </div>
</body>
</html>
