<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Color Token List Demo</title>
    <link rel="stylesheet" href="../../../style/main.css" />
    <link rel="stylesheet" href="../swatch/swatch.css" />
    <link rel="stylesheet" href="./color-token-list.css" />
  </head>
  <body>
    <main class="stack" data-gap="lg" style="max-width: 24rem; margin: 2rem auto;">
      <h1 class="section-header__title">Color Token List</h1>
      <p class="section-header__description">Editable list of color tokens with name, swatch preview, and hex value.</p>
      <div class="color-token-list">
        <div class="color-token-list__row"><span class="swatch"></span><code>--accent</code><input value="#2563eb" /></div>
        <div class="color-token-list__row"><span class="swatch" data-variant="dark"></span><code>--surface-muted</code><input value="#1e293b" /></div>
      </div>
    </main>
  </body>
</html>
