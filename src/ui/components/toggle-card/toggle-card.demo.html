<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Toggle Card Demo</title>
    <link rel="stylesheet" href="../../../style/main.css" />
    <link rel="stylesheet" href="./toggle-card.css" />
  </head>
  <body>
    <main class="stack" data-gap="lg" style="max-width: 24rem; margin: 2rem auto;">
      <h1 class="section-header__title">Toggle Card</h1>
      <p class="section-header__description">Card-style selectable toggle button.</p>
      <button class="toggle-card" data-state="inactive"><span class="toggle-card__label">Inactive option</span></button>
      <button class="toggle-card" data-state="active"><span class="toggle-card__label">Active option</span></button>
      <button class="toggle-card" data-state="inactive" data-disabled="true"><span class="toggle-card__label">Disabled option</span></button>
    </main>
  </body>
</html>
