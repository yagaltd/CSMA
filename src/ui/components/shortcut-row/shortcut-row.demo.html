<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shortcut Row Demo</title>
    <link rel="stylesheet" href="../../../style/main.css" />
    <link rel="stylesheet" href="./shortcut-row.css" />
  </head>
  <body>
    <main class="stack" data-gap="md" style="max-width: 24rem; margin: 2rem auto;">
      <h1 class="section-header__title">Shortcut Row</h1>
      <p class="section-header__description">One keyboard shortcut entry with key binding and description.</p>
      <div class="shortcut-row"><kbd>Ctrl</kbd> + <kbd>S</kbd><span>Save</span></div>
      <div class="shortcut-row"><kbd>Ctrl</kbd> + <kbd>Z</kbd><span>Undo</span></div>
    </main>
  </body>
</html>
